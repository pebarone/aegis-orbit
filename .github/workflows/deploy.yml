name: Deploy AegisOrbit

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  AZURE_WEBAPP_NAME: app-aegis-orbit-rm99781

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resourceGroup = "rg-aegis-orbit-rm99781"
          $app = "${{ env.AZURE_WEBAPP_NAME }}"
          $startup = "bash -c 'cd /home/site/wwwroot && python -m pip install --no-cache-dir --disable-pip-version-check -r requirements.txt --target /tmp/aegis-python && export PYTHONPATH=/tmp/aegis-python:`${PYTHONPATH:-} && python -m uvicorn app.main:app --host 0.0.0.0 --port `${PORT:-8000}'"
          az webapp config appsettings set --resource-group $resourceGroup --name $app --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false --output none
          az webapp config set --resource-group $resourceGroup --name $app --startup-file $startup --output none
          Remove-Item -Recurse -Force deploy-package, deploy.zip -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path deploy-package/app, deploy-package/frontend | Out-Null
          Copy-Item requirements.txt deploy-package/
          Copy-Item app/*.py deploy-package/app/
          Copy-Item frontend/dist deploy-package/frontend/ -Recurse
          Push-Location deploy-package
          zip -r ../deploy.zip .
          Pop-Location
          az webapp deploy --resource-group $resourceGroup --name $app --src-path deploy.zip --type zip --clean true --restart false --output none
          az webapp restart --resource-group $resourceGroup --name $app --output none

      - name: Smoke test public app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          for ($attempt = 1; $attempt -le 18; $attempt++) {
            try {
              Invoke-RestMethod $url -TimeoutSec 30
              Invoke-WebRequest "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/app/" -TimeoutSec 30 | Out-Null
              exit 0
            } catch {
              Start-Sleep -Seconds 20
            }
          }
          throw "Health endpoint did not become ready."
