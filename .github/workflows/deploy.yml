name: Deploy AegisOrbit

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  AZURE_WEBAPP_NAME: app-aegis-orbit-rm99781

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resourceGroup = "rg-aegis-orbit-rm99781"
          $app = "${{ env.AZURE_WEBAPP_NAME }}"
          az webapp config appsettings set --resource-group $resourceGroup --name $app --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false --output none
          az webapp config set --resource-group $resourceGroup --name $app --startup-file "bash /home/site/wwwroot/startup.sh" --output none
          $creds = az webapp deployment list-publishing-credentials --resource-group $resourceGroup --name $app | ConvertFrom-Json
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($creds.publishingUserName):$($creds.publishingPassword)"))
          $headers = @{ Authorization = "Basic $basic"; "If-Match" = "*" }
          $base = "https://$app.scm.azurewebsites.net/api"
          $body = @{ command = '/bin/sh -c "rm -rf /home/site/wwwroot/* && mkdir -p /home/site/wwwroot/app && touch /home/site/wwwroot/requirements.txt /home/site/wwwroot/startup.sh /home/site/wwwroot/app/main.py /home/site/wwwroot/app/__init__.py"'; dir = "/home/site/wwwroot" } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$base/command" -Headers @{ Authorization = "Basic $basic" } -ContentType "application/json" -Body $body -TimeoutSec 60 | Out-Null
          function Write-KuduFile($localPath, $remotePath) {
            $payload = [Convert]::ToBase64String([IO.File]::ReadAllBytes($localPath))
            $command = "/bin/sh -c `"printf '%s' '$payload' | base64 -d > $remotePath && chmod 755 $remotePath`""
            $writeBody = @{ command = $command; dir = "/home/site/wwwroot" } | ConvertTo-Json -Compress
            $result = Invoke-RestMethod -Method Post -Uri "$base/command" -Headers @{ Authorization = "Basic $basic" } -ContentType "application/json" -Body $writeBody -TimeoutSec 60
            if ($result.ExitCode -ne 0) {
              throw "Kudu write failed for $remotePath`: $($result.Error)"
            }
          }
          Write-KuduFile "requirements.txt" "/home/site/wwwroot/requirements.txt"
          Write-KuduFile "startup.sh" "/home/site/wwwroot/startup.sh"
          Write-KuduFile "app/main.py" "/home/site/wwwroot/app/main.py"
          Write-KuduFile "app/__init__.py" "/home/site/wwwroot/app/__init__.py"
          $verifyBody = @{ command = '/bin/sh -c "test -s /home/site/wwwroot/startup.sh && test -s /home/site/wwwroot/app/main.py"'; dir = "/home/site/wwwroot" } | ConvertTo-Json
          $verify = Invoke-RestMethod -Method Post -Uri "$base/command" -Headers @{ Authorization = "Basic $basic" } -ContentType "application/json" -Body $verifyBody -TimeoutSec 60
          if ($verify.ExitCode -ne 0) {
            throw "Deployment file verification failed."
          }
          az webapp restart --resource-group $resourceGroup --name $app --output none

      - name: Smoke test public app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          for ($attempt = 1; $attempt -le 18; $attempt++) {
            try {
              Invoke-RestMethod $url -TimeoutSec 30
              exit 0
            } catch {
              Start-Sleep -Seconds 20
            }
          }
          throw "Health endpoint did not become ready."
