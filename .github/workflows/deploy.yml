name: Deploy AegisOrbit

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  AZURE_WEBAPP_NAME: app-aegis-orbit-rm99781

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resourceGroup = "rg-aegis-orbit-rm99781"
          $app = "${{ env.AZURE_WEBAPP_NAME }}"
          az webapp config appsettings set --resource-group $resourceGroup --name $app --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false --output none
          az webapp config set --resource-group $resourceGroup --name $app --startup-file "bash /home/site/wwwroot/startup.sh" --output none
          $creds = az webapp deployment list-publishing-credentials --resource-group $resourceGroup --name $app | ConvertFrom-Json
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($creds.publishingUserName):$($creds.publishingPassword)"))
          $headers = @{ Authorization = "Basic $basic"; "If-Match" = "*" }
          $base = "https://$app.scm.azurewebsites.net/api"
          $body = @{ command = '/bin/sh -c "rm -rf /home/site/wwwroot/* && mkdir -p /home/site/wwwroot/app && touch /home/site/wwwroot/requirements.txt /home/site/wwwroot/startup.sh /home/site/wwwroot/app/main.py /home/site/wwwroot/app/__init__.py"'; dir = "/home/site/wwwroot" } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$base/command" -Headers @{ Authorization = "Basic $basic" } -ContentType "application/json" -Body $body -TimeoutSec 60 | Out-Null
          Invoke-WebRequest -Method Put -Uri "$base/vfs/site/wwwroot/requirements.txt" -Headers $headers -InFile requirements.txt -ContentType "text/plain" -TimeoutSec 60 | Out-Null
          Invoke-WebRequest -Method Put -Uri "$base/vfs/site/wwwroot/startup.sh" -Headers $headers -InFile startup.sh -ContentType "text/x-sh" -TimeoutSec 60 | Out-Null
          Invoke-WebRequest -Method Put -Uri "$base/vfs/site/wwwroot/app/main.py" -Headers $headers -InFile app/main.py -ContentType "text/x-python" -TimeoutSec 60 | Out-Null
          Invoke-WebRequest -Method Put -Uri "$base/vfs/site/wwwroot/app/__init__.py" -Headers $headers -InFile app/__init__.py -ContentType "text/x-python" -TimeoutSec 60 | Out-Null
          az webapp restart --resource-group $resourceGroup --name $app --output none

      - name: Smoke test public app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Start-Sleep -Seconds 90
          Invoke-RestMethod "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health" -TimeoutSec 30
